# Local PostgreSQL for development. Background jobs use a DB-polled worker, so no Redis is needed.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: oes
      POSTGRES_PASSWORD: oes
      POSTGRES_DB: oes
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
