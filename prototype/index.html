<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Enrollment Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
:root{
  --ink:#1d2340; --muted:#5b6382; --line:#e3e6f0; --bg:#f6f7fb; --card:#fff;
  --brand:#2b59c3; --brand-2:#1b3f94; --accent:#ff8a3d; --good:#1f9d6b; --bad:#d64545; --warn:#c98a06;
  --pink:#f7a8c4; --tan:#f2c48d; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:"Baloo 2",Inter,sans-serif;line-height:1.15;margin:0 0 .4em}
h2{font-size:1.6rem} h3{font-size:1.2rem}
button{font:inherit;cursor:pointer}
a{color:var(--brand)}
.hide{display:none!important}

/* header */
header{background:linear-gradient(120deg,#1b3f94,#2b59c3 60%,#3f7be0);color:#fff;padding:18px 24px 0}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center}
.logo b{font-family:"Baloo 2";font-size:1.35rem;letter-spacing:.2px}
.logo small{display:block;opacity:.8;font-size:.8rem;margin-top:-4px}
.pill{border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25)}
.pill.open{background:#e7f8f0;color:#11734d;border-color:#bfe9d6}
.pill.closed{background:#fde9e9;color:#a12f2f;border-color:#f6c9c9}
.pill.soon{background:#fff4dd;color:#8a5d00;border-color:#f3dca5}
.spacer{flex:1}
nav{display:flex;gap:4px;max-width:1180px;margin:14px auto 0;overflow-x:auto}
nav button{background:none;border:0;color:#dfe7ff;padding:10px 16px;border-radius:10px 10px 0 0;font-weight:600;white-space:nowrap}
nav button.on{background:var(--bg);color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:24px}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 1px 2px rgba(20,30,70,.04)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.muted{color:var(--muted)} .small{font-size:.85rem}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:#c9cfe2}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:.85rem}
label.f{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:10px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;color:var(--ink);background:#fff}
label.f textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #b8c9f2;border-color:var(--brand)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice{border-radius:12px;padding:12px 14px;background:#eef3ff;border:1px solid #d5e0fb;color:#22397a;font-size:.9rem}
.notice.warn{background:#fff7e6;border-color:#f3dfae;color:#6b4b00}
.notice.err{background:#fdeeee;border-color:#f3caca;color:#8b2525}
.notice.ok{background:#e9f8f1;border-color:#c3ead8;color:#145c3f}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef1f8;color:#3b4570;letter-spacing:.3px}
.badge.enrolled{background:#e3f6ee;color:#11734d}
.badge.waived{background:#f1edf9;color:#5b3d99}
.badge.pending{background:#fff3dc;color:#8a5d00}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.tablewrap{overflow-x:auto}
.stat .n{font-family:"Baloo 2";font-size:2rem;font-weight:700;line-height:1}
.stat .l{color:var(--muted);font-size:.82rem;font-weight:600}
.bar{height:10px;border-radius:99px;background:#eceff7;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px}

/* steps */
.steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.steps span{flex:1;min-width:90px;font-size:.78rem;font-weight:700;color:var(--muted);border-top:4px solid var(--line);padding-top:6px}
.steps span.on{color:var(--brand);border-color:var(--brand)}
.steps span.done{color:var(--good);border-color:var(--good)}

/* plan card */
.plan{display:flex;flex-direction:column;gap:10px;border:2px solid var(--line);border-radius:16px;padding:18px;background:#fff;transition:.15s}
.plan.sel{border-color:var(--brand);box-shadow:0 0 0 4px #dfe8fb}
.plan .price{font-family:"Baloo 2";font-size:1.9rem;font-weight:700;line-height:1}
.plan dl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:0;font-size:.86rem}
.plan dt{color:var(--muted)} .plan dd{margin:0;font-weight:600;text-align:right}
.watch{background:linear-gradient(135deg,#ff8a3d,#ff5f6d);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:700;display:flex;align-items:center;gap:10px;justify-content:center}
.watch:hover{filter:brightness(1.05)}
.watch .tri{width:0;height:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
.dep{border:1px dashed #cfd5e6;border-radius:12px;padding:12px;margin-bottom:10px}

/* setup */
.plan-edit{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;background:#fcfcfe}
.sbc{border:2px dashed #c9d4f0;border-radius:12px;padding:14px;background:#f5f8ff}
.savebar{position:sticky;bottom:0;background:rgba(246,247,251,.94);backdrop-filter:blur(6px);padding:12px 0;margin-top:10px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.progress{font-size:.85rem;color:var(--muted);white-space:pre-wrap}

/* ===== Player ===== */
#modal{position:fixed;inset:0;background:rgba(14,18,40,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
.player{width:min(1040px,100%);background:#0f1530;border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.ptop{display:flex;align-items:center;gap:10px;color:#cfd8ff;padding:10px 14px;font-size:.85rem}
.ptop b{color:#fff;font-family:"Baloo 2";font-size:1.05rem}
.stage{position:relative;aspect-ratio:16/9;background:#bfe3ff}
.stage svg{width:100%;height:100%;display:block}
.caption{background:#141b3d;color:#fff;padding:12px 18px;min-height:74px;display:flex;gap:12px;align-items:flex-start;font-size:1.05rem}
.caption .who{font-family:"Baloo 2";font-weight:700;border-radius:8px;padding:0 10px;font-size:.95rem;white-space:nowrap}
.who.penny{background:var(--pink);color:#5a1736}
.who.patch{background:var(--tan);color:#5b3507}
.pctrl{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#0f1530;flex-wrap:wrap}
.pbtn{background:#222b55;color:#fff;border:0;border-radius:10px;width:42px;height:38px;font-size:1rem;display:grid;place-items:center}
.pbtn.big{background:var(--accent);width:52px}
.pbtn:hover{filter:brightness(1.15)}
.dots{display:flex;gap:5px;flex:1;min-width:120px}
.dots i{flex:1;height:6px;border-radius:9px;background:#2c3666;cursor:pointer}
.dots i.done{background:#7d93e6} .dots i.on{background:var(--accent)}
.ptoggle{color:#cfd8ff;font-size:.82rem;display:flex;gap:6px;align-items:center}
.pfoot{color:#8e9bd0;font-size:.75rem;padding:0 14px 12px}

/* scene panel (inside foreignObject) */
.panel{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:"Baloo 2",sans-serif;color:#1d2340;padding:10px}
.panel h1{font-size:46px;margin:0;line-height:1.05;color:#1b3f94}
.panel h2{font-size:30px;margin:0 0 12px;color:#1b3f94}
.panel p{font-size:21px;margin:8px 0 0;color:#3a4266;font-family:Inter,sans-serif;font-weight:500}
.kicker{display:inline-block;background:#ff8a3d;color:#fff;border-radius:999px;padding:2px 14px;font-size:18px;margin-bottom:12px;font-weight:700}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.slideup{animation:slideup .5s ease-out both}
@keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.jar{position:relative;width:150px;height:210px;border:7px solid #1d2340;border-top-width:0;border-radius:0 0 34px 34px;background:#fff;overflow:hidden;margin:6px auto 0}
.jar::before{content:"";position:absolute;left:-14px;right:-14px;top:0;height:7px;background:#1d2340}
.jar .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:repeating-linear-gradient(45deg,#ffcf4a 0 14px,#ffbf1f 14px 28px);animation:fill 2.6s ease-in-out .4s forwards}
@keyframes fill{to{height:78%}}
.amount{font-size:44px;font-weight:800;color:#ff5f6d;line-height:1}
.tags{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:520px}
.tag{background:#fff;border:4px solid #1d2340;border-radius:14px;padding:8px 14px;min-width:150px;box-shadow:4px 4px 0 #1d2340}
.tag b{display:block;font-size:30px;color:#2b59c3;line-height:1}
.tag span{font-size:16px;font-family:Inter;font-weight:600;color:#3a4266}
.split{display:flex;width:470px;height:86px;border:5px solid #1d2340;border-radius:18px;overflow:hidden;margin-top:6px}
.split div{display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-weight:800;font-size:26px;line-height:1;width:0;animation:grow 1.4s ease-out .3s forwards}
.split small{font-size:14px;font-family:Inter;font-weight:700;opacity:.95}
@keyframes grow{to{width:var(--w)}}
.receipt{background:#fff;width:440px;border:4px solid #1d2340;border-radius:8px;padding:14px 20px;text-align:left;font-family:Inter;box-shadow:6px 6px 0 #1d2340}
.receipt h3{font-family:"Baloo 2";font-size:24px;margin:0 0 8px;color:#1b3f94;text-align:center}
.receipt .r{display:flex;justify-content:space-between;border-bottom:2px dashed #d5d9e8;padding:5px 0;font-size:17px;font-weight:600}
.receipt .t{display:flex;justify-content:space-between;padding-top:8px;font-family:"Baloo 2";font-size:26px;font-weight:800;color:#ff5f6d}
.items{list-style:none;padding:0;margin:0;text-align:left;width:460px}
.items li{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid #1d2340;border-radius:12px;padding:7px 12px;margin-bottom:8px;font-size:19px;font-family:Inter;font-weight:600}
.items .ic{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-family:"Baloo 2";font-size:20px}
.quiz{width:480px}
.quiz .q{font-size:26px;font-weight:700;color:#1b3f94;margin-bottom:12px;line-height:1.15}
.quiz button{display:block;width:100%;text-align:left;margin-bottom:9px;background:#fff;border:4px solid #1d2340;border-radius:14px;padding:9px 14px;font:600 19px Inter,sans-serif;color:#1d2340;box-shadow:4px 4px 0 #1d2340}
.quiz button.right{background:#c9f2df;border-color:#118457}
.quiz button.wrong{background:#fbd5d5;border-color:#b52f2f}
.quiz .fb{font-family:Inter;font-weight:700;font-size:18px;min-height:26px}

/* characters */
.char .mouth{transform-box:fill-box;transform-origin:center}
.char.talking .mouth{animation:talk .2s infinite alternate}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1.35)}}
.char .bob{transform-box:fill-box;transform-origin:bottom center}
.char.talking .bob{animation:bob .5s infinite alternate ease-in-out}
@keyframes bob{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-8px) rotate(1.5deg)}}
.char .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.floaty{animation:floaty 6s ease-in-out infinite alternate}
@keyframes floaty{to{transform:translateY(-14px)}}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr} main{padding:16px}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo">
      <div class="logo-mark"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="18" rx="2" fill="#ff8a3d"/><rect x="3" y="9" width="18" height="6" rx="2" fill="#2b59c3"/></svg></div>
      <div><b>Open Enrollment Studio</b><small id="hCompany">Small-group health benefits</small></div>
    </div>
    <div class="spacer"></div>
    <span id="hStatus" class="pill">Loading…</span>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"><div class="card">Loading…</div></main>
<div id="modal" role="dialog" aria-modal="true"></div>

<script>
/* ================= utilities ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g,'')); return isFinite(n) ? n : 0; };
const money = n => '$' + (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const uidGen = () => 'p' + Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const fmtDate = d => { if(!d) return '—'; const x = new Date(d + (d.length===10?'T12:00:00':'')); return isNaN(x) ? d : x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };

const TIERS = {ee:'Employee only', es:'Employee + Spouse/Partner', ec:'Employee + Child(ren)', fam:'Family'};
const PERIODS = {52:'Weekly',26:'Every two weeks',24:'Twice a month',12:'Monthly'};
const WAIVE = ["Covered by spouse/partner's employer plan","Covered by another employer plan","Medicare","Medicaid / CHIP","TRICARE / VA","Individual (Marketplace) plan","Other"];
const VALID_WAIVE = new Set(WAIVE.slice(0,5));
const RELS = ['Spouse','Domestic partner','Child'];

const S = {
  db:null, user:null, uid:null, admin:false, sample:null, tts:null, dl:null, ready:false,
  config:null, configLoaded:false, videos:{}, enrollments:[], loadNote:'',
  view:'enroll', wiz:{step:0, d:null, editing:false, err:'', saving:false},
  draft:null, dirty:false, sbcText:{}, gen:{}, saveMsg:''
};

/* ================= domain ================= */
function blankConfig(){
  return {company:'', broker:'Davidson Solutions', brokerContact:'', planYear:String(new Date().getFullYear()+1),
    effective:'', windowStart:'', windowEnd:'', payPeriods:26, eePct:50, depPct:0, participationMin:70,
    roster:[], plans:[]};
}
function blankPlan(){
  return {id:uidGen(), name:'New plan', carrier:'', type:'PPO', deductible:'', deductibleFam:'', oop:'', oopFam:'',
    coinsurance:'', pcp:'', specialist:'', urgent:'', er:'', rx:'', rates:{ee:0,es:0,ec:0,fam:0}, sbcName:''};
}
function windowState(c){
  if(!c || !c.windowStart || !c.windowEnd) return {k:'soon', label:'Enrollment dates not set', open:false};
  const today = new Date().toISOString().slice(0,10);
  if(today < c.windowStart) return {k:'soon', label:'Opens ' + fmtDate(c.windowStart), open:false};
  if(today > c.windowEnd) return {k:'closed', label:'Closed ' + fmtDate(c.windowEnd), open:false};
  return {k:'open', label:'Open until ' + fmtDate(c.windowEnd), open:true};
}
function tierOf(deps){
  const sp = (deps||[]).some(d => d.rel==='Spouse' || d.rel==='Domestic partner');
  const ch = (deps||[]).some(d => d.rel==='Child');
  return sp && ch ? 'fam' : sp ? 'es' : ch ? 'ec' : 'ee';
}
function cost(plan, tier, c){
  const r = plan?.rates || {}; const P = num(r[tier]); const E = num(r.ee);
  const er = Math.min(P, E*num(c.eePct)/100 + Math.max(0,P-E)*num(c.depPct)/100);
  const ee = Math.max(0, P - er); const per = ee*12/(num(c.payPeriods)||26);
  return {premium:P, employer:er, employee:ee, perCheck:per};
}
const planById = id => (S.config?.plans||[]).find(p => p.id===id);

/* ================= rendering shell ================= */
function setView(v){ S.view = v; try{ history.replaceState(null,'','#'+v); }catch(e){} render(true); window.scrollTo(0,0); }
function tabs(){
  const t = [['enroll','Enroll'],['plans','Plans & Videos']];
  if(S.admin){ t.push(['dashboard','Dashboard'],['setup','Setup']); }
  return t;
}
function render(force){
  const c = S.config; const ws = windowState(c);
  $('#hCompany').textContent = c?.company ? `${c.company} · ${c.planYear} benefits${c.broker ? ' · via ' + c.broker : ''}` : 'Small-group health benefits';
  const st = $('#hStatus'); st.className = 'pill ' + (S.configLoaded ? ws.k : ''); st.textContent = S.configLoaded ? ws.label : 'Loading…';
  $('#nav').innerHTML = tabs().map(([k,l]) => `<button data-act="view" data-v="${k}" class="${S.view===k?'on':''}">${l}</button>`).join('');
  // don't wipe a form the viewer is typing in
  const ae = document.activeElement;
  if(!force && ae && $('#app').contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
  const app = $('#app');
  if(!S.ready){ app.innerHTML = `<div class="card">${S.loadNote ? esc(S.loadNote) : 'Connecting…'}</div>`; return; }
  if(!S.configLoaded){ app.innerHTML = `<div class="card">${S.loadNote ? esc(S.loadNote) : 'Loading enrollment…'}</div>`; return; }
  const v = (!S.admin && (S.view==='dashboard'||S.view==='setup')) ? 'enroll' : S.view;
  app.innerHTML = v==='plans' ? viewPlans() : v==='dashboard' ? viewDashboard() : v==='setup' ? viewSetup() : viewEnroll();
}

/* ================= Plans view ================= */
function planFacts(p){
  const rows = [['Deductible', p.deductible],['Out-of-pocket max', p.oop],['Coinsurance', p.coinsurance],['Primary care', p.pcp],['Specialist', p.specialist],['Urgent care', p.urgent],['Emergency room', p.er],['Generic Rx', p.rx]]
    .filter(r => r[1]);
  return rows.length ? `<dl>${rows.map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>` : `<div class="small muted">Plan details not entered yet.</div>`;
}
function watchBtn(p){
  return S.videos[p.id] ? `<button class="watch" data-act="watch" data-id="${esc(p.id)}"><span class="tri"></span> Watch the 2-minute explainer</button>` : `<div class="small muted">No explainer video yet.</div>`;
}
function viewPlans(){
  const c = S.config;
  if(!c || !c.plans?.length) return emptyState();
  return `<div class="hero" style="margin-bottom:20px">
    <div><h2>Your plan options for ${esc(c.planYear)}</h2>
    <p class="muted">Each plan has a short cartoon explainer made from its official Summary of Benefits and Coverage (SBC). Penny and Patch walk through the deductible, copays, the out-of-pocket max and a real-life cost example. Then there's a quiz.</p></div>
    <div>${miniHosts()}</div></div>
    <div class="grid g3">${c.plans.map(p => {
      const k = cost(p,'ee',c);
      return `<div class="plan"><div class="row"><span class="badge">${esc(p.type||'Plan')}</span><span class="small muted">${esc(p.carrier)}</span></div>
      <h3 style="margin:0">${esc(p.name)}</h3>
      <div><span class="price">${money(k.perCheck)}</span> <span class="small muted">/ paycheck, employee only</span></div>
      ${planFacts(p)}${watchBtn(p)}</div>`;}).join('')}</div>`;
}
function emptyState(){
  return `<div class="card"><h3>Enrollment isn't set up yet</h3><p class="muted">Your employer or broker hasn't added plans yet. Check back soon.</p>
  ${S.admin ? `<button class="btn primary" data-act="view" data-v="setup">Go to Setup</button>` : ''}</div>`;
}
function miniHosts(){
  return `<svg viewBox="0 0 400 190" style="width:100%;max-width:380px;display:block;margin-left:auto">
    <ellipse cx="200" cy="178" rx="190" ry="12" fill="#dfe6f7"/>

function validateStep(){

async function extractPdf(file){
  if(!window.pdfjsLib) throw new Error('The PDF reader did not load. Paste the SBC text instead.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf, isEvalSupported:false}).promise;
  let out = [];
  for(let i=1;i<=pdf.numPages;i++){
    const pg = await pdf.getPage(i); const tc = await pg.getTextContent();
    let line = '', lastY = null;
    for(const it of tc.items){ const y = it.transform?.[5]; if(lastY!==null && Math.abs(y-lastY)>4){ out.push(line); line=''; } line += it.str + (it.hasEOL?'\n':' '); lastY = y; }
    out.push(line, `\n--- page ${i} ---\n`);
  }
  return {text: out.join('\n').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n'), pages: pdf.numPages};
}
function genMsg(id, msg){ S.gen[id] = {...(S.gen[id]||{}), msg}; const el = $('#gen-'+id); if(el) el.textContent = msg; }
function buildPrompt(text, p){
  return `You are writing the script for a short animated explainer video about ONE health insurance plan, for employees of a small business during open enrollment. Two original cartoon hosts talk in a friendly, playful back-and-forth, like a kids' educational cartoon: PENNY (a curious piggy bank who asks the questions real people have) and PATCH (a cheerful bandage who explains clearly). Write at about a 6th-grade reading level: short sentences, light humor, and explain every insurance word the first time it is used.

The employer calls this plan: "${(p.name||'').replace(/"/g,"'")}"

Make 7 to 10 scenes in this order, skipping any the SBC can't support:
1. title: welcome and the plan name
2. meter: the deductible, what it is (with a simple everyday analogy), and this plan's amount
3. prices: copays for common care (primary care, specialist, urgent care, ER, generic drugs), up to 5 items
4. split: coinsurance after the deductible (you pay X%, the plan pays Y%)

7. list (tone "good"): notable covered services, like free preventive care
8. list (tone "bad"): services the plan does NOT cover, from the SBC's excluded services section
9. list (tone "good"): recap with 3 to 5 key numbers to remember

Each scene has 1 to 3 dialogue lines, each under 200 characters, alternating hosts. Penny opens the video; Patch closes it by reminding viewers the SBC and plan documents are the official word.

{
 "plan": {"name": "", "carrier": "", "type": "PPO|HMO|EPO|POS|HDHP/HSA|Other", "deductible": "", "deductibleFam": "", "oop": "", "oopFam": "", "coinsurance": "", "pcp": "", "specialist": "", "urgent": "", "er": "", "rx": ""},

  {"visual": {"kind": "list", "title": "", "tone": "good", "items": [""]}, "lines": []},
  {"visual": {"kind": "quiz", "question": "", "options": ["", "", ""], "answer": 0}, "lines": []}
 ]
}
Plan values are short strings (e.g. "$1,500 individual", "$25 copay", "20% after deductible"); use "" for anything the SBC doesn't state. "who" is "penny" or "patch". "answer" is the 0-based index of the correct option.

SBC TEXT:
"""
${text.slice(0, 90000)}
"""`;
}
async function generate(i){
  const p = S.draft.plans[i]; const id = p.id;
  const ta = document.querySelector(`[data-sbc="${id}"]`); if(ta && ta.value.trim()) S.sbcText[id] = ta.value;
  const text = (S.sbcText[id]||'').trim();
  if(text.length < 300){ genMsg(id, '⚠ Upload the SBC PDF (or paste its text) first. If your PDF is a scanned image, copy the text from it and paste it instead.'); return; }
  const ctl = new AbortController();
  S.gen[id] = {...(S.gen[id]||{}), busy:true, ctl, msg:'Claude is reading the SBC and writing the script… (usually 30–90 seconds)'}; render(true);
  try{
    let chars = 0;
    const out = await S.sample.json(buildPrompt(text, p), {signal: ctl.signal, cache:false, onText: ({text:t}) => { if(t.length - chars > 300){ chars = t.length; genMsg(id, `Writing the script… ${Math.round(t.length/100)/10}k characters`); } }});
    const scenes = (Array.isArray(out?.scenes) ? out.scenes : []).filter(s => s && s.visual && Array.isArray(s.lines) && s.lines.length);
    if(scenes.length < 3) throw {code:'bad_script'};
    scenes.forEach(s => s.lines = s.lines.slice(0,4).map(l => ({who: l.who==='patch'?'patch':'penny', text: String(l.text||'').slice(0,600)})).filter(l => l.text));
    // fill plan details from SBC (rates are kept)
    const pl = out.plan || {}; const dp = S.draft.plans.find(x => x.id===id);
    if(dp){ ['carrier','deductible','deductibleFam','oop','oopFam','coinsurance','pcp','specialist','urgent','er','rx'].forEach(k => { if(pl[k]) dp[k] = String(pl[k]).slice(0,120); });
      if(pl.type && ['PPO','HMO','EPO','POS','HDHP/HSA','Other'].includes(pl.type)) dp.type = pl.type;
      if((!dp.name || dp.name==='New plan') && pl.name) dp.name = String(pl.name).slice(0,80);
      dp.sbcName = S.gen[id]?.file || dp.sbcName || 'pasted text'; }
    await S.db.doc('videos/' + id).set({planId:id, planName: dp?.name || '', scenes: scenes.slice(0,12), createdAt: new Date().toISOString()});
    await S.db.doc('config/main').set(draftForSave()); S.dirty = false;
    S.gen[id] = {busy:false, msg:`✓ Explainer ready: ${scenes.length} scenes. Plan details were filled in from the SBC; check them and add monthly rates.`};
  }catch(e){
    const m = e?.code==='cancelled' ? 'Stopped.' : e?.code==='not_granted' ? 'Claude access was declined for this page, so videos can’t be made.' : e?.code==='rate_limited' ? 'Claude is busy or you’ve hit a usage limit. Try again in a bit.' : e?.code==='bad_script' || e?.code==='invalid_json' ? 'The script came back incomplete. Press the button to try again.' : e?.code==='invalid_argument' ? 'Only editors can save videos.' : 'Something went wrong (' + (e?.code||e?.message||'error') + '). Try again.';
    S.gen[id] = {busy:false, msg:'⚠ ' + m};
  }
  render(true);
}

function stopPlayback(){ P.token++; clearTimeout(P.timer); P.playing = false; if(S.tts && S.tts.active()) S.tts.stop().catch(()=>{}); }
function playFrom(i, line=0){
  stopPlayback(); P.playing = true; const tok = P.token; showScene(i, line); setTalking(true); setPlayBtn();
  if(S.tts && P.voice){
    const lines = [];
    for(let s=i; s<P.scenes.length; s++) P.scenes[s].lines.forEach((l,k) => { if(s===i && k<line) return; lines.push({text:l.text.slice(0,1900), voice: l.who==='patch'?'rounded':'airy', id:`${s}.${k}`, language:'en'}); });
    S.tts.speak(lines.slice(0,100)).then(() => { if(tok!==P.token) return; finish(); }).catch(e => {
      if(tok!==P.token) return;
      if(e?.code==='stopped' && e.reason!=='viewer_stopped') return;
      if(e?.code==='stopped'){ P.playing=false; setTalking(false); setPlayBtn(); return; }
      P.voice = false; const cb = document.querySelector('[data-act="pvoice"]'); if(cb) cb.checked = false; captionsRun(P.i, P.line, tok);
    });
  } else captionsRun(i, line, tok);
}
function captionsRun(i, line, tok){
  if(tok!==P.token) return;
  const sc = P.scenes[i]; if(!sc){ finish(); return; }
  if(line >= sc.lines.length){ captionsRun(i+1, 0, tok); return; }
  showScene(i, line); setTalking(true);
  const words = sc.lines[line].text.split(/\s+/).length; const ms = Math.max(2600, words/2.7*1000 + 700);
  P.timer = setTimeout(() => captionsRun(i, line+1, tok), ms);
}
function finish(){ P.playing = false; setTalking(false); setPlayBtn(); revealQuiz(null); }
function revealQuiz(pick){
  const sc = P.scenes[P.i]; if(sc?.visual?.kind!=='quiz' || P.quiz!==null && pick===null) return;
  const ans = Math.round(num(sc.visual.answer)); if(pick!==null) P.quiz = pick; else P.quiz = -1;
  document.querySelectorAll('.quiz button').forEach((b,k) => { b.classList.toggle('right', k===ans); b.classList.toggle('wrong', pick!==null && k===pick && k!==ans); });
  const fb = $('#quizFb'); if(fb) fb.textContent = pick===null ? `The answer is ${String.fromCharCode(65+ans)}!` : pick===ans ? '🎉 You got it!' : `Not quite. The answer is ${String.fromCharCode(65+ans)}.`;
}
function closePlayer(){ stopPlayback(); const m = $('#modal'); m.classList.remove('on'); m.innerHTML = ''; }

/* ================= events ================= */
function setPath(path, val){
  const ks = path.split('.'); let o = S;
  for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null) o[ks[i]] = /^\d+$/.test(ks[i+1]) ? [] : {}; o = o[ks[i]]; }
  o[ks[ks.length-1]] = val;
}
document.addEventListener('input', e => {
  const b = e.target.dataset?.bind; if(!b) { const sb = e.target.dataset?.sbc; if(sb) S.sbcText[sb] = e.target.value; return; }
  const v = e.target.type==='checkbox' ? e.target.checked : (e.target.hasAttribute('data-num') ? num(e.target.value) : e.target.value);
  setPath(b, v);
  if(b.startsWith('draft.')){ S.dirty = true; const m = $('#saveMsg'); if(m) m.textContent = 'Unsaved changes'; }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if(t.dataset?.bind && (t.tagName==='SELECT' || t.type==='checkbox')){
    setPath(t.dataset.bind, t.type==='checkbox' ? t.checked : (t.hasAttribute('data-num') ? num(t.value) : t.value));
    if(t.dataset.bind.startsWith('draft.')) S.dirty = true;
    if(/deps\.\d+\.rel|waiveReason/.test(t.dataset.bind)) render(true);
  }
  if(t.dataset?.act==='pvoice'){ P.voice = t.checked; if(P.playing) playFrom(P.i, P.line); }
  if(t.dataset?.act==='sbcFile' && t.files?.[0]){
    const id = t.dataset.id; const f = t.files[0]; S.gen[id] = {...(S.gen[id]||{}), file:f.name};
    genMsg(id, 'Reading ' + f.name + '…');
    try{
      if(/\.txt$/i.test(f.name)){ S.sbcText[id] = await f.text(); genMsg(id, `✓ Read ${f.name}. Ready to make the video.`); }
      else { const r = await extractPdf(f); S.sbcText[id] = r.text;
        genMsg(id, r.text.trim().length < 300 ? `⚠ ${f.name} has almost no selectable text (it may be a scanned image). Paste the SBC text instead.` : `✓ Read ${r.pages} pages of ${f.name}. Ready to make the video.`); }
    }catch(err){ genMsg(id, '⚠ Couldn’t read that PDF: ' + (err?.message||err) + ' Try pasting the text instead.'); }
  }
});
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act; if(el.tagName==='INPUT') return;
  const W = S.wiz;
  switch(a){
    case 'view': setView(el.dataset.v); break;
    case 'wizStart': startWiz(); render(true); break;
    case 'wizBack': W.err=''; if(W.step<=1){ W.editing=false; W.step=0; } else W.step--; render(true); break;
    case 'wizNext': { const err = validateStep(); W.err = err; if(err){ render(true); break; } if(W.step===4) await submitElection(); else { W.step++; render(true); } window.scrollTo(0,0); break; }
    case 'depAdd': W.d.deps.push({name:'', rel: W.d.deps.some(x => x.rel!=='Child') ? 'Child' : 'Spouse', dob:''}); render(true); break;
    case 'depDel': W.d.deps.splice(+el.dataset.i,1); render(true); break;
    case 'choose': W.d.choice = el.dataset.id; render(true); break;
    case 'watch': openPlayer(el.dataset.id); break;
    case 'pclose': closePlayer(); break;
    case 'pplay':
      if(P.playing){ if(S.tts && P.voice && S.tts.active()){ S.tts.pause().catch(()=>{}); P.paused = true; } else { P.token++; clearTimeout(P.timer); } P.playing=false; setTalking(false); setPlayBtn(); }
      else if(P.paused && S.tts && P.voice && S.tts.active()){ P.paused=false; P.playing=true; S.tts.resume().catch(()=>playFrom(P.i,P.line)); setTalking(true); setPlayBtn(); }
      else { P.paused=false; const atEnd = P.i===P.scenes.length-1 && P.line>=P.scenes[P.i].lines.length-1 && P.quiz!==null; playFrom(atEnd?0:P.i, atEnd?0:P.line); }
      break;
    case 'pprev': P.paused=false; playFrom(Math.max(0,P.i-1)); break;
    case 'pnext': P.paused=false; if(P.i < P.scenes.length-1) playFrom(P.i+1); break;
    case 'pgo': P.paused=false; playFrom(+el.dataset.i); break;
    case 'quiz': revealQuiz(+el.dataset.i); break;
    case 'csvCopy': try{ await navigator.clipboard.writeText(csv()); dashMsg('CSV copied. Paste it into a spreadsheet.'); }catch(err){ dashMsg('Copy was blocked by the browser.', 'warn'); } break;
    case 'csvDl': try{ await S.dl.save({filename:`${(S.config.company||'group').replace(/[^\w-]+/g,'_')}_enrollment_${S.config.planYear}.csv`, data: csv()}); dashMsg('CSV saved.'); }catch(err){ if(err?.code!=='declined') dashMsg('Download unavailable here. Use Copy CSV instead.', 'warn'); } break;
    case 'planAdd': ensureDraft(); S.draft.plans.push(blankPlan()); S.dirty = true; render(true); break;
    case 'planDel': { ensureDraft(); const p = S.draft.plans[+el.dataset.i]; if(!el.dataset.confirm){ el.dataset.confirm='1'; el.textContent='Click again to remove'; setTimeout(()=>{ if(el.isConnected){ delete el.dataset.confirm; el.textContent='Remove'; } },3000); break; }
      S.draft.plans.splice(+el.dataset.i,1); S.dirty = true; render(true); break; }
    case 'sbcPasteToggle': { const id = el.dataset.id; S.gen[id] = {...(S.gen[id]||{}), paste: !(S.gen[id]?.paste)}; $('#paste-'+id)?.classList.toggle('hide'); break; }
    case 'gen': generate(+el.dataset.i); break;
    case 'genStop': S.gen[el.dataset.id]?.ctl?.abort(); break;
    case 'saveSetup': await saveSetup(); break;
    case 'revert': S.draft = null; S.dirty = false; render(true); break;
  }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && $('#modal').classList.contains('on')) closePlayer(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if(['enroll','plans','dashboard','setup'].includes(h) && h!==S.view){ S.view = h; render(true); } });

/* ================= boot ================= */
(async function boot(){
  const h = location.hash.slice(1); if(['enroll','plans','dashboard','setup'].includes(h)) S.view = h;
  render(true);
  if(!window.claude?.use){ S.loadNote = 'Open this page on claude.ai to use it.'; render(true); return; }
  const use = n => claude.use(n).catch(() => null);
  const [db, user, sample, tts, dl] = await Promise.all([use('db'), use('user'), use('sample'), use('tts'), use('downloads')]);
  Object.assign(S, {db, user, sample, tts, dl});
  if(!db){ S.loadNote = 'Sign in to Claude to open enrollment.'; render(true); return; }
  S.uid = user ? await user.id() : null;
  S.admin = user ? await user.canEdit() : false;
  if(S.admin && !h) S.view = 'dashboard';
  if(tts){ tts.onLine(({id}) => { if(!id || !P.playing) return; const [s,l] = id.split('.').map(Number); showScene(s,l); setTalking(true); }); }
  S.ready = true; render(true);
  const t = setTimeout(() => { S.loadNote = 'The enrollment data can’t be reached yet. Check your connection.'; render(true); }, 10000);
  db.doc('config/main').onSnapshot(s => {
    if(!s.metadata.fromCache) clearTimeout(t);
    S.config = s.exists ? s.data() : null; S.configLoaded = true;
    if(S.config && !S.dirty) S.draft = null;
    if(!S.config && S.admin && S.view!=='setup'){ S.view = 'setup'; render(true); return; }
    render();
  }, err => { clearTimeout(t); S.loadNote = 'Couldn’t load enrollment (' + err.code + ').'; S.configLoaded = false; render(true); });
  db.collection('videos').onSnapshot(q => { S.videos = {}; q.docs.forEach(d => S.videos[d.id] = d.data()); render(); }, () => {});
  db.collection('enrollments').onSnapshot(q => { S.enrollments = q.docs.map(d => ({id:d.id, ...d.data()})); render(); }, () => {});
})();
</script>
